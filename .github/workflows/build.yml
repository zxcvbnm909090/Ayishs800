name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -oq ALFAISALTunnel.zip -d proj
          ls -R proj | head -30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          gradle -p "$DIR" :app:assembleDebug -PAPI_BASE_URL="${{ vars.API_BASE_URL || 'https://example.com' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALFAISAL-Tunnel-apk
          path: proj/**/*.apk
          if-no-files-found: error
